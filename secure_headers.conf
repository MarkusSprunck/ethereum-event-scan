add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cache-Control "no-cache" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https: wss: http: ws:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), display-capture=(), fullscreen=(self), geolocation=(), clipboard-read=(self), clipboard-write=(self)" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
